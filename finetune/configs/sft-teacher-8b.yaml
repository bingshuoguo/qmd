# Teacher SFT config — Qwen3-8B BF16 LoRA on dual 4090 24 GB GPUs.
#
# Inherits the sealed public-distill-v2-vh-prompt-v1 release.  Same prompt,
# LoRA rank, optimizer, and effective batch size as Student SFT.
#
# Use configs/accelerate_fsdp2.yaml for full parameter sharding across both 24 GB GPUs.
#
# Usage:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   accelerate launch --config_file configs/accelerate_fsdp2.yaml \
#     train_sft_v1.py --teacher --config configs/sft-teacher-8b.yaml \
#     --run-root /root/autodl-tmp/runs

release:
  manifest: data/public-distill-v2-vh-prompt-v1/experiments/public-main-v2-vh-prompt-v1/release-manifest.json
  release_id: public-distill-v2-vh-prompt-v1
  experiment_id: public-main-v2-vh-prompt-v1

model:
  model_id: /root/autodl-tmp/models/Qwen3-8B
  revision: main
  dtype: bfloat16
  load_in_4bit: false
  load_in_8bit: false
  full_finetuning: false
  trust_remote_code: false
  max_seq_length: 1024

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  num_train_epochs: 3
  max_steps: -1
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.01
  max_grad_norm: 1.0

precision:
  bf16: true
  fp16: false
  gradient_checkpointing: true
  full_determinism: false
  seed: 42
  data_seed: 42

checkpointing:
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 3
  save_only_model: false
  load_best_model_at_end: false

logging:
  logging_strategy: steps
  logging_steps: 5
  report_to:
    - tensorboard
